[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lite-code"
dynamic = ["version"]
description = "Lite Code - 手写的 Code 开发 Agent 桌面工具 (基于《AI Code Agent 手把手》课程)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "tree-sitter>=0.24",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java>=0.23,<0.24",
    "tree-sitter-go>=0.23",
    "pathspec>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
]
package = [
    "pyinstaller>=6.10",
]
# 办公/通用生产力场景（GAI 入口）：文档、表格、演示、图表、数据分析
office = [
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.21",
    "reportlab>=4.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.scripts]
lite-code = "litecode.cli:main"

[tool.setuptools.packages.find]
include = ["litecode*"]

# 版本单一事实源：litecode/__init__.py 的 __version__
[tool.setuptools.dynamic]
version = {attr = "litecode.__version__"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 每个测试默认 60s 超时（thread 法可强制中断），防止个别测试挂住拖死整轮测试；
# pytest-timeout 属于开发依赖，未安装时该参数会导致 pytest 报错，按需 pip install pytest-timeout
addopts = "--timeout=60 --timeout-method=thread"
