<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F8CFF"/>
      <stop offset="0.55" stop-color="#6C7BFF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 圆角渐变底 -->
  <rect x="0" y="0" width="1024" height="1024" rx="190" fill="url(#bg)"/>
  <!-- 顶部高光 -->
  <rect x="0" y="0" width="1024" height="560" rx="190" fill="url(#gloss)"/>

  <!-- 代码大括号（左波形） -->
  <path d="M250 330h230a175 175 0 0 1 0 350H250"
        fill="none" stroke="#ffffff" stroke-width="72"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 代码光标（右竖条） -->
  <rect x="628" y="256" width="120" height="512" rx="60" fill="#ffffff"/>
  <!-- 光标内渐变切痕，增加细节 -->
  <rect x="646" y="396" width="84" height="232" rx="42" fill="rgba(139,92,246,0.35)"/>

  <!-- 底部基线（代码行） -->
  <rect x="250" y="740" width="498" height="30" rx="15" fill="#ffffff" opacity="0.9"/>
</svg>